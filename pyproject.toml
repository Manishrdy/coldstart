[project]
name = "coldstart"
version = "0.1.0"
description = "Automated job sourcing, filtering, and LLM-based resume matching pipeline"
requires-python = ">=3.12"
dependencies = [
    "ats-scrapers[parquet]",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pydantic-settings",
    "email-validator",
    "httpx",
    "openai",
    "anthropic",
    "google-genai",
    "tenacity",
    "rich",
    "pypdf",
    "python-docx",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "freezegun",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldstart"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/coldstart"]
