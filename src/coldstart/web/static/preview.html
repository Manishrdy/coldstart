<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email template preview</title>
  <script>
    (() => { const t = localStorage.getItem("coldstart-theme");
             if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="bar">
    <h1>Email template preview</h1>
    <span class="path">config/email/digest.html.j2</span>
    <span class="spacer" style="flex:1"></span>
    <span id="saved" class="saved">reloaded</span>
    <div class="seg" role="group" aria-label="Preview width">
      <button id="w-desktop" type="button" aria-pressed="true" style="min-width:auto;padding:.28rem .6rem;">Desktop</button>
      <button id="w-phone" type="button" aria-pressed="false" style="min-width:auto;padding:.28rem .6rem;">Phone</button>
    </div>
    <button id="w-text" class="btn" type="button" aria-pressed="false">Plain text</button>
    <button id="reload" class="btn" type="button">Reload</button>
    <div class="seg" role="group" aria-label="Colour theme">
      <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light theme" title="Light">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button type="button" data-theme-choice="system" aria-pressed="false" aria-label="Match system theme" title="System">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/></svg>
      </button>
    </div>
    <a class="btn" href="/">← Dashboard</a>
  </div>
  <div class="stage"><iframe id="frame" src="/preview/email/render"></iframe></div>

<script src="/static/theme.js"></script>
<script>
"use strict";
const frame = document.getElementById("frame");
const saved = document.getElementById("saved");
let fmt = "html";

function refresh() {
  frame.src = `/preview/email/render?fmt=${fmt}&t=${Date.now()}`;
  saved.classList.add("show");
  setTimeout(() => saved.classList.remove("show"), 900);
}

function setWidth(phone) {
  frame.classList.toggle("phone", phone);
  document.getElementById("w-desktop").setAttribute("aria-pressed", String(!phone));
  document.getElementById("w-phone").setAttribute("aria-pressed", String(phone));
}

document.getElementById("w-desktop").onclick = () => setWidth(false);
document.getElementById("w-phone").onclick = () => setWidth(true);
document.getElementById("reload").onclick = refresh;
document.getElementById("w-text").onclick = e => {
  fmt = fmt === "text" ? "html" : "text";
  e.currentTarget.setAttribute("aria-pressed", String(fmt === "text"));
  refresh();
};

// This is the "realtime" part: poll the mtime of everything in config/email/
// and reload the frame the moment you save. Cheap — it's a stat() call.
let version = null;
setInterval(async () => {
  try {
    const { version: v } = await fetch("/api/preview/version").then(r => r.json());
    if (version !== null && v !== version) refresh();
    version = v;
  } catch { /* daemon restarting; the next tick picks it up */ }
}, 1000);
</script>
</body>
</html>
