<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coldstart</title>
  <!-- Applied before first paint so the page never flashes the wrong theme. -->
  <script>
    (() => { const t = localStorage.getItem("coldstart-theme");
             if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#10052;</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/>
        </svg>
      </span>
      <h1>Coldstart</h1>
      <span id="live-dot" class="dot" role="status" aria-label="Connecting"></span>
      <span id="digest-line" class="tagline"></span>
    </div>

    <div id="status-strip" class="status-strip"><span class="muted">connecting…</span></div>

    <div class="topbar-actions">
      <button id="poll-toggle" class="btn" type="button" aria-pressed="false" hidden>
        <svg id="poll-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
        <span id="poll-toggle-label">Pause polling</span>
      </button>
      <a class="btn" href="/preview/email">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>
        </svg>
        Email template
      </a>
      <div class="seg" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light theme" title="Light">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
        <button type="button" data-theme-choice="system" aria-pressed="false" aria-label="Match system theme" title="System">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section id="tiles" class="tiles" aria-label="Pipeline metrics"></section>

    <section class="controls">
      <div class="seg" id="view-seg" role="group" aria-label="Which jobs to show">
        <button type="button" data-view="open" aria-pressed="true">Open</button>
        <button type="button" data-view="applied" aria-pressed="false">Applied</button>
        <button type="button" data-view="declined" aria-pressed="false">Declined</button>
        <button type="button" data-view="all" aria-pressed="false">All</button>
        <button type="button" data-view="held" aria-pressed="false">Held back</button>
      </div>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <label class="visually-hidden" for="search">Search jobs</label>
        <input id="search" type="search" placeholder="Search company, title, location, skills…" autocomplete="off">
      </div>
      <label class="visually-hidden" for="band-filter">Filter by band</label>
      <select id="band-filter">
        <option value="">All bands</option>
        <option value="strong">Strong</option>
        <option value="consider">Consider</option>
        <option value="reject">Reject</option>
      </select>
      <label class="visually-hidden" for="ats-filter">Filter by ATS</label>
      <select id="ats-filter"><option value="">All ATS</option></select>
      <label class="visually-hidden" for="company-filter">Filter by company</label>
      <select id="company-filter"><option value="">All companies</option></select>
      <label class="toggle" for="include-reject">
        <input id="include-reject" type="checkbox">
        <span>Include reject band</span>
      </label>
      <span class="spacer"></span>
      <span id="row-count" aria-live="polite"></span>
      <button id="download" class="btn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/>
        </svg>
        Export
      </button>
    </section>

    <section class="table-wrap">
      <table id="jobs">
        <thead><tr id="head-row"></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
